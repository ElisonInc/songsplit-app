name: One-time legal copy cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/legal-copy-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove overstated legal claims from app source and PDF copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/index.html")
          text = path.read_text()

          replacements = {
              'content="Real-time music ownership agreements. Define who owns what at the moment of creation."': 'content="Real-time music ownership documentation. Capture who owns what at the moment of creation."',
              '<title>SongSplit | Music Ownership Agreements</title>': '<title>SongSplit | Music Ownership Documentation</title>',
              'Create real-time music ownership agreements. Define Master & Publishing rights while the vibe is fresh.': 'Document music ownership decisions in real time. Define Master & Publishing rights while the session is fresh.',
              'All contributors define ownership while creating. No disputes later.': 'All contributors define ownership while creating. A clearer record for later.',
              '<h3 class="font-semibold mb-1 text-sm">Legally Binding</h3>': '<h3 class="font-semibold mb-1 text-sm">Agreement Capture</h3>',
              'Digital signatures + PDF agreements recognized by PROs & labels.': 'Digital signatures + PDF records for documented collaboration.',
              'I agree that my electronic signature is legally binding and carries the same weight as a handwritten signature. I understand this agreement will be used for PRO registration, royalty distributions, and licensing.': 'I consent to use my electronic signature to record my approval of the ownership terms shown in this session. I understand SongSplit records this approval but does not provide legal advice or guarantee enforceability or acceptance by any PRO, label, publisher, court, or other third party.',
              'is_public: true': 'is_public: false',
              'doc.text("MUSIC OWNERSHIP AGREEMENT", pageWidth/2, 20, { align: \'center\' });': 'doc.text("MUSIC OWNERSHIP RECORD", pageWidth/2, 20, { align: \'center\' });',
              'doc.text("SongSplit | Music Ownership Agreements", pageWidth/2, 28, { align: \'center\' });': 'doc.text("SongSplit | Music Ownership Documentation", pageWidth/2, 28, { align: \'center\' });',
              'const agreementText = `The undersigned contributors agree that the above splits represent the fair division of ownership rights for the song "${this.data.songTitle || \'[Untitled]\'}". This includes both Master Recording rights and Publishing rights as indicated. These percentages shall be used for all royalty distributions, PRO registrations, and any licensing agreements. This agreement is binding and enforceable.`;': 'const agreementText = `The contributors listed above recorded the ownership splits shown for the song "${this.data.songTitle || \'[Untitled]\'}". Master Recording and Publishing rights are documented separately as indicated. This record reflects the terms entered and approved in SongSplit at finalization. SongSplit does not provide legal advice or guarantee enforceability, PRO registration, royalty treatment, licensing acceptance, or third-party recognition.`;',
              'doc.text("This document serves as a binding music ownership agreement.", pageWidth/2, 285, { align: \'center\' });': 'doc.text("This document records the ownership terms entered and approved in SongSplit.", pageWidth/2, 285, { align: \'center\' });',
              'doc.text("Verify at: splitsheet.app/verify", pageWidth/2, 290, { align: \'center\' });': 'doc.text("Generated by SongSplit • songsplit.org", pageWidth/2, 290, { align: \'center\' });',
          }

          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old)
              text = text.replace(old, new)

          if missing:
              print("Warning: some exact legacy strings were already absent:")
              for item in missing:
                  print(" -", item[:120])

          path.write_text(text)

          banned = [
              "Legally Binding",
              "recognized by PROs & labels",
              "No disputes later",
              "legally binding and carries the same weight",
              "binding and enforceable",
              "serves as a binding music ownership agreement",
              "splitsheet.app/verify",
              "is_public: true",
          ]
          remaining = [phrase for phrase in banned if phrase in text]
          if remaining:
              raise SystemExit(f"Legacy claims/settings still present: {remaining}")
          PY

      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git commit -m "content: remove overstated legal claims from SongSplit app"
          git push
