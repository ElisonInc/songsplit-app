name: One-time app-domain root routing fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-domain-root-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make bare app subdomain open the app
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          marker = '    <title>SongSplit | Music Ownership Documentation</title>\n'
          snippet = '''    <title>SongSplit | Music Ownership Documentation</title>\n    <script>\n      if (window.location.hostname === 'app.songsplit.org' && (window.location.pathname === '/' || window.location.pathname === '')) {\n        window.location.replace('/app');\n      }\n    </script>\n'''

          if "window.location.hostname === 'app.songsplit.org'" in text:
              raise SystemExit('App-domain root redirect already present')
          if marker not in text:
              raise SystemExit('Expected title marker not found')

          path.write_text(text.replace(marker, snippet, 1))
          PY

      - name: Commit routing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: send bare app subdomain to SongSplit app"
          git push
