name: One-time SongSplit runtime repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-runtime-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair app runtime defects
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/index.html')
          text = path.read_text()

          replacements = [
              ('onclick="app.finalizeSheet()"', 'onclick="app.finalizeAgreement()"'),
              ("                    text.textContent = 'Live';", "                    if (text) text.textContent = 'Live';"),
              ("                    text.textContent = 'Offline';", "                    if (text) text.textContent = 'Offline';"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new, 1)

          if 'app.finalizeSheet()' in text:
              raise SystemExit('Legacy finalize handler remains')

          path.write_text(text)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git commit -m "fix: repair SongSplit finalize action and status guard"
          git push
